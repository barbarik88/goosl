<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Coin Strike — Hold &amp; Win Demo</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="background-orbs" aria-hidden="true"></div>
    <main class="app">
      <header class="app-header">
        <h1 class="brand">Coin Strike Studio</h1>
        <button
          class="mute-toggle"
          type="button"
          aria-label="Toggle sound"
          aria-pressed="false"
        >
          <span class="mute-icon" data-sound="on">🔊</span>
        </button>
      </header>
      <section class="device-shell" aria-label="Coin Strike slot machine">
        <div class="device-border">
          <div class="device-screen">
            <div class="payment-row" role="list" aria-label="Payment methods">
              <span class="payment-badge">VISA</span>
              <span class="payment-badge">Mastercard</span>
              <span class="payment-badge">Apple&nbsp;Pay</span>
              <span class="payment-badge">Google&nbsp;Pay</span>
              <span class="payment-badge">PayPal</span>
              <span class="payment-badge">Crypto</span>
            </div>
            <div class="counter-row">
              <article class="counter-card" aria-live="polite">
                <span class="counter-title">Bonus</span>
                <span class="counter-value" data-counter-bonus>€1,500</span>
              </article>
              <article class="counter-card" aria-live="polite">
                <span class="counter-title">Free Spins</span>
                <span class="counter-value" data-counter-fs>150</span>
              </article>
            </div>
            <div class="jackpot-row" role="group" aria-label="Jackpots">
              <article class="jackpot-card grand">
                <span class="jackpot-title">Grand</span>
                <span class="jackpot-value" data-jackpot="grand"></span>
              </article>
              <article class="jackpot-card major">
                <span class="jackpot-title">Major</span>
                <span class="jackpot-value" data-jackpot="major"></span>
              </article>
              <article class="jackpot-card minor">
                <span class="jackpot-title">Minor</span>
                <span class="jackpot-value" data-jackpot="minor"></span>
              </article>
              <article class="jackpot-card mini">
                <span class="jackpot-title">Mini</span>
                <span class="jackpot-value" data-jackpot="mini"></span>
              </article>
            </div>
            <div class="logo-stack">
              <span class="logo-top">Coin</span>
              <span class="logo-bottom">Strike</span>
            </div>
            <section
              class="grid"
              id="coin-grid"
              role="grid"
              aria-label="Hold and win board"
            ></section>
            <div class="status-strip">
              <div class="status-item">
                <span class="status-label">Bonus pot</span>
                <span class="status-value" data-bonus-pot>€0</span>
              </div>
              <div class="status-item">
                <span class="status-label">Min win</span>
                <span class="status-value" data-min-win>€10</span>
              </div>
              <div class="status-item">
                <span class="status-label">Timer</span>
                <span class="status-value" data-timer>10:00</span>
              </div>
            </div>
            <div class="balance-strip">
              <div class="balance-item">
                <span class="balance-label">Balance</span>
                <span class="balance-value" data-balance>€0</span>
              </div>
              <div class="balance-item">
                <span class="balance-label">Bet</span>
                <span class="balance-value" data-bet>€2</span>
              </div>
              <div class="balance-item win">
                <span class="balance-label">Last win</span>
                <span class="balance-value" data-last-win>€0</span>
              </div>
            </div>
            <button id="start-button" class="start-button" type="button">
              START
            </button>
          </div>
        </div>
      </section>
    </main>
    <script src="app.js"></script>
  </body>
</html>
